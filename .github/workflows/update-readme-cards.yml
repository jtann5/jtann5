name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"   # Daily at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ensure output dir exists
        run: mkdir -p profile

      # Main stats card
      # - name: Generate stats card
      #   uses: stats-organization/github-readme-stats-action@v1
      #   with:
      #     card: stats
      #     options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&hide_border=false&include_all_commits=false&count_private=false
      #     path: profile/stats.svg
          # token: ${{ secrets.GH_STATS_TOKEN }}  # optional (rate limits / private contribs)

      # Top languages card (replacement for /api/top-langs)
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=dark&hide_border=false&include_all_commits=false&count_private=false&layout=compact
          path: profile/top-langs.svg
          # token: ${{ secrets.GH_STATS_TOKEN }}  # optional

      # Commit if changed
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg || true
          git diff --cached --quiet || (git commit -m "Update README cards" && git push)
